name: Build AutoQ Releases (100% Rust Linux + Windows + Android APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Workspace Tests & Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests across workspace
        run: cargo test --workspace

  build-linux-packages:
    name: Linux 100% Rust (AppImage + DEB + Binaries)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin fuse libfuse2 squashfs-tools dpkg-dev curl

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build 100% Rust AppImage, CLI & GUI binaries
        run: |
          chmod +x linux-appimage/build_appimage.sh
          ./linux-appimage/build_appimage.sh
          cp target/release/autoq-cli linux-appimage/dist/autoq-cli-linux-x86_64
          cp target/release/autoq-gui linux-appimage/dist/autoq-gui-linux-x86_64
          cp target/release/autoq-daemon linux-appimage/dist/autoq-daemon-linux-x86_64
          chmod +x linux-appimage/dist/autoq-cli-linux-x86_64 linux-appimage/dist/autoq-gui-linux-x86_64 linux-appimage/dist/autoq-daemon-linux-x86_64

      - name: Build Debian/Ubuntu .deb package
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version = ' crates/autoq-core/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          fi
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh "${VER}"
          cp packaging/deb/dist/autoq_*_amd64.deb linux-appimage/dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoQ-Linux-Packages
          path: |
            linux-appimage/dist/AutoQ-x86_64.AppImage
            linux-appimage/dist/autoq-gui-linux-x86_64
            linux-appimage/dist/autoq-cli-linux-x86_64
            linux-appimage/dist/autoq-daemon-linux-x86_64
            linux-appimage/dist/autoq_*_amd64.deb

  build-linux-arm64:
    name: Linux ARM64 100% Rust (Binaries)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64 binaries
        run: |
          cargo build --release --workspace
          mkdir -p dist-arm64
          cp target/release/autoq-cli dist-arm64/autoq-cli-linux-aarch64
          cp target/release/autoq-gui dist-arm64/autoq-gui-linux-aarch64
          cp target/release/autoq-daemon dist-arm64/autoq-daemon-linux-aarch64
          chmod +x dist-arm64/*

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoQ-Linux-ARM64
          path: dist-arm64/*

  build-windows-native:
    name: Windows Installer & Portable x64 (100% Rust)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build native AutoQ binaries & AutoQ-Setup-x64.exe
        shell: pwsh
        working-directory: windows-beta
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "autoq-win.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $env:WINDOWS_CERT_PFX = $pfxPath
          }
          .\build_windows.ps1

      - name: Clean up temporary Windows signing cert
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "autoq-win.pfx")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoQ-Windows-x64
          path: |
            windows-beta/dist/AutoQ-Setup-x64.exe
            windows-beta/dist/AutoQ-Windows-x64.zip

  build-android-apk:
    name: Android APK (Kotlin + Jetpack Compose)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/autoq-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${ANDROID_KEYSTORE_PATH}"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AutoQ-Android.apk

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/autoq-release.jks"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoQ-Android-APK
          path: android/AutoQ-Android.apk

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-packages, build-linux-arm64, build-windows-native, build-android-apk]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets & SHA256SUMS.txt
        run: |
          mkdir -p dist-release
          cp release-assets/AutoQ-Linux-Packages/* dist-release/
          cp release-assets/AutoQ-Linux-ARM64/* dist-release/
          cp release-assets/AutoQ-Windows-x64/* dist-release/
          cp release-assets/AutoQ-Android-APK/AutoQ-Android.apk dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Descargas incluidas (100 % Rust Nativo en Escritorio)
            - **Linux AppImage (`AutoQ-x86_64.AppImage`)**: aplicación 100 % nativa en Rust (`< 10 MB`) con instaladores 1-clic de Hyprland, KDE Plasma 6, `autoq-daemon` y reglas `udev`.
            - **Debian / Ubuntu / Mint (`autoq_*_amd64.deb`)**: instalable con `sudo apt install ./autoq_*_amd64.deb` (configura reglas USB `udev` `0660 + uaccess` y unidad `autoq-daemon.service`).
            - **Linux Binarios Independientes**: `x86_64` y `ARM64` (`aarch64`) para `autoq-gui`, `autoq-cli` y `autoq-daemon`.
            - **Windows 10/11 (`AutoQ-Setup-x64.exe` y portable `AutoQ-Windows-x64.zip`)**: instalador único + paquete portable 100 % Rust nativo (`AutoQ.exe` sin ventanas de consola emergentes, 8 familias DSP + Equalizer APO).
            - **Android (`AutoQ-Android.apk`)**: APK release firmado (actualizable encima en futuras versiones), Kotlin + Jetpack Compose con temas modulares (`Default`, `Default claro`, `NothingOS`), widget sincronizado y exportadores multi-formato.
            - **Sumas de verificación (`SHA256SUMS.txt`)**.
          files: dist-release/*
