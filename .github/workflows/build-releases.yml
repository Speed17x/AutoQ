name: Build Trivium Releases (Linux + Windows + macOS ARM64 + Android APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust Workspace Tests & Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests across workspace
        run: cargo test --workspace

  build-linux-packages:
    name: Linux Rust x64 (AppImage + DEB + Binaries)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev librsvg2-bin fuse libfuse2 squashfs-tools dpkg-dev curl

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build AppImage, CLI & GUI binaries
        run: |
          chmod +x linux-appimage/build_appimage.sh
          ./linux-appimage/build_appimage.sh
          cp target/release/trivium-cli linux-appimage/dist/trivium-cli-linux-x86_64
          cp target/release/trivium linux-appimage/dist/trivium-linux-x86_64
          cp target/release/trivium-daemon linux-appimage/dist/trivium-daemon-linux-x86_64
          chmod +x linux-appimage/dist/trivium-cli-linux-x86_64 linux-appimage/dist/trivium-linux-x86_64 linux-appimage/dist/trivium-daemon-linux-x86_64

      - name: Build Debian/Ubuntu .deb package
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 '^version = ' crates/trivium-core/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          fi
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh "${VER}"
          cp packaging/deb/dist/trivium_*_amd64.deb linux-appimage/dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trivium-Linux-Packages
          path: |
            linux-appimage/dist/Trivium-x86_64.AppImage
            linux-appimage/dist/trivium-linux-x86_64
            linux-appimage/dist/trivium-cli-linux-x86_64
            linux-appimage/dist/trivium-daemon-linux-x86_64
            linux-appimage/dist/trivium_*_amd64.deb

  build-linux-arm64:
    name: Linux ARM64 Rust (Binaries)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64 binaries
        run: |
          cargo build --release --workspace
          mkdir -p dist-arm64
          cp target/release/trivium-cli dist-arm64/trivium-cli-linux-aarch64
          cp target/release/trivium dist-arm64/trivium-linux-aarch64
          cp target/release/trivium-daemon dist-arm64/trivium-daemon-linux-aarch64
          chmod +x dist-arm64/*

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trivium-Linux-ARM64
          path: dist-arm64/*

  build-macos-arm64:
    name: macOS ARM64 Experimental (Binaries)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS ARM64 binaries & test workspace
        run: |
          cargo test --workspace
          cargo build --release --workspace
          mkdir -p dist-macos/Trivium-macOS-arm64
          cp target/release/trivium dist-macos/Trivium-macOS-arm64/trivium
          cp target/release/trivium-cli dist-macos/Trivium-macOS-arm64/trivium-cli
          cp target/release/trivium-daemon dist-macos/Trivium-macOS-arm64/trivium-daemon
          chmod +x dist-macos/Trivium-macOS-arm64/*
          cat > dist-macos/Trivium-macOS-arm64/README-macOS.txt << 'EOF'
          Trivium — Compilación Experimental para macOS Apple Silicon (ARM64)

          Esta compilación no está firmada con certificado Apple Developer.
          Si Gatekeeper bloquea la ejecución tras descomprimir, ejecuta:
            xattr -dr com.apple.quarantine ./trivium ./trivium-cli ./trivium-daemon
          Soporta los 9 protocolos USB-C HID/CDC de hardware DSP, exportación multi-formato
          (APO, EasyEffects, CamillaDSP, Wavelet) y `trivium-cli hid-scan --dump-descriptors`.
          EOF
          (cd dist-macos && zip -r Trivium-macOS-arm64.zip Trivium-macOS-arm64)

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trivium-macOS-arm64
          path: dist-macos/Trivium-macOS-arm64.zip

  build-windows-native:
    name: Windows Installer & Portable x64 (Rust)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-tests]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build native Trivium binaries & Trivium-Setup-x64.exe
        shell: pwsh
        working-directory: windows-beta
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "trivium-win.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $env:WINDOWS_CERT_PFX = $pfxPath
          }
          .\build_windows.ps1

      - name: Clean up temporary Windows signing cert
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "trivium-win.pfx")

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trivium-Windows-x64
          path: |
            windows-beta/dist/Trivium-Setup-x64.exe
            windows-beta/dist/Trivium-Windows-x64.zip

  build-android-apk:
    name: Android APK (Kotlin + Jetpack Compose)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/trivium-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${ANDROID_KEYSTORE_PATH}"
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Trivium-Android.apk

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/trivium-release.jks"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trivium-Android-APK
          path: android/Trivium-Android.apk

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-packages, build-linux-arm64, build-macos-arm64, build-windows-native, build-android-apk]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets & SHA256SUMS.txt
        run: |
          mkdir -p dist-release
          cp release-assets/Trivium-Linux-Packages/* dist-release/
          cp release-assets/Trivium-Linux-ARM64/* dist-release/
          cp release-assets/Trivium-macOS-arm64/* dist-release/ 2>/dev/null || true
          cp release-assets/Trivium-Windows-x64/* dist-release/
          cp release-assets/Trivium-Android-APK/Trivium-Android.apk dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Descargas incluidas (**Trivium** — Hardware DSP · EQ Global · AutoEQ)
            - **Linux AppImage (`Trivium-x86_64.AppImage`)**: aplicación nativa en Rust con instaladores 1-clic de Hyprland, KDE Plasma 6 (`org.speed17x.trivium`), `trivium-daemon` y reglas `udev`.
            - **Debian / Ubuntu / Mint (`trivium_*_amd64.deb`)**: instalable con `sudo apt install ./trivium_*_amd64.deb`.
            - **Linux Binarios Independientes**: `x86_64` y `ARM64` (`aarch64`) para `trivium`, `trivium-cli` y `trivium-daemon`.
            - **Windows 10/11 (`Trivium-Setup-x64.exe` y portable `Trivium-Windows-x64.zip`)**: instalador único + paquete portable (`Trivium.exe` con 9 familias USB DSP y Equalizer APO).
            - **macOS Apple Silicon Experimental (`Trivium-macOS-arm64.zip`)**: binarios `aarch64-apple-darwin` para hardware USB DSP y exportación.
            - **Android (`Trivium-Android.apk`)**: app independiente `com.speed17x.trivium` con 9 familias USB DSP, transporte inalámbrico BLE GATT (FiiO EH11/EH13 y Airoha/Maxwell), ganancia/atenuación de salida `-30..+12 dB`, temas modulares y widget sincronizado.
            - **Sumas de verificación (`SHA256SUMS.txt`)**.
          files: dist-release/*
