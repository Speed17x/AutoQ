[package]
name = "trivium-gui"
version = "3.0.0"
edition.workspace = true
license.workspace = true
description = "Native 100% Rust desktop GUI & floating widget for Trivium (eframe/egui)"

[[bin]]
name = "trivium"
path = "src/main.rs"

[dependencies]
trivium-core = { workspace = true }
eframe = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
