[package]
name = "autoq-gui"
version = "2.1.2"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native 100% Rust Nothing OS desktop GUI & floating widget for AutoQ (eframe/egui)"

[[bin]]
name = "autoq-gui"
path = "src/main.rs"

[dependencies]
autoq-core = { path = "../autoq-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde_json = "1.0"
