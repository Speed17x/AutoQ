[package]
name = "autoq-gui"
version = "2.2.0"
edition.workspace = true
license.workspace = true
description = "Native 100% Rust Nothing OS desktop GUI & floating widget for AutoQ (eframe/egui)"

[[bin]]
name = "autoq-gui"
path = "src/main.rs"

[dependencies]
autoq-core = { workspace = true }
eframe = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
