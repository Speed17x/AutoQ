[package]
name = "trivium-core"
version = "3.0.1"
edition.workspace = true
license.workspace = true
description = "Core DSP biquad optimizer, 9 USB-C HID/Serial DSP protocols, BLE GATT codecs, 8-source AutoEQ engine, and OS audio backends for Trivium"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
csv = { workspace = true }
ureq = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
winreg = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
