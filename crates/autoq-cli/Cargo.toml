[package]
name = "autoq-cli"
version = "2.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Unified ultra-fast JSON CLI & hardware telemetry backend for AutoQ (Linux, KDE Plasma, Hyprland/Waybar, Windows)"

[[bin]]
name = "autoq-cli"
path = "src/main.rs"

[dependencies]
autoq-core = { path = "../autoq-core" }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
