[package]
name = "autoq-daemon"
version = "2.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Optional background auto-profile daemon for AutoQ (watches USB udev/serial & PipeWire sinks)"

[[bin]]
name = "autoq-daemon"
path = "src/main.rs"

[dependencies]
autoq-core = { path = "../autoq-core" }
serde_json = "1.0"
