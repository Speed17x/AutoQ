[package]
name = "autoq-core"
version = "2.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Core DSP biquad optimizer, USB-C HID transport (KTMicro 5B & Moondrop 8B), 8-source AutoEQ engine, and OS audio backends for AutoQ"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
csv = "1.3"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
