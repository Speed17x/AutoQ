[package]
name = "autoq-core"
version = "2.2.0"
edition.workspace = true
license.workspace = true
description = "Core DSP biquad optimizer, USB-C HID transport (KTMicro 5B & Moondrop 8B), 8-source AutoEQ engine, and OS audio backends for AutoQ"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
csv = { workspace = true }
ureq = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
