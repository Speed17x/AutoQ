[package]
name = "trivium-daemon"
version = "3.0.0"
edition.workspace = true
license.workspace = true
description = "Optional background auto-profile daemon for Trivium (watches USB udev/serial & PipeWire sinks)"

[[bin]]
name = "trivium-daemon"
path = "src/main.rs"

[dependencies]
trivium-core = { workspace = true }
serde_json = { workspace = true }
