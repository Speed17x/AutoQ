# ============================================================================
# AutoQ — Nothing OS Floating EQ Widget para Hyprland
# ============================================================================
# Copia este contenido dentro de tu ~/.config/hypr/hyprland.conf
# (o agrega:  source = ~/.local/share/autoq-hyprland/hyprland-autoq.conf)
# ============================================================================

# ── Reglas de ventana (Hyprland <= 0.52) ────────────────────────────────────
windowrulev2 = float, class:^(autoq-widget|autoq-gui)$
windowrulev2 = pin, class:^(autoq-widget|autoq-gui)$
windowrulev2 = noborder, class:^(autoq-widget|autoq-gui)$
windowrulev2 = noshadow, class:^(autoq-widget|autoq-gui)$
windowrulev2 = noblur, class:^(autoq-widget|autoq-gui)$
windowrulev2 = move 100%-w-20 56, class:^(autoq-widget|autoq-gui)$

# Nota: Si usas Hyprland >= 0.53 (nueva sintaxis windowrule), usa en su lugar:
# windowrule {
#     name = autoq-widget
#     match:class = ^(autoq-widget|autoq-gui)$
#     float = on
#     pin = on
#     border_size = 0
#     no_shadow = on
#     no_blur = on
#     move = (monitor_w-window_w-20) 56
# }

# ── Atajos de teclado ───────────────────────────────────────────────────────
# SUPER + E : Mostrar / ocultar el widget Nothing OS (mantiene tu estado)
bind = SUPER, E, exec, ~/.local/bin/autoq-widget --toggle

# SUPER + SHIFT + E : Abrir directamente en modo App completa (3 pestañas)
bind = SUPER SHIFT, E, exec, ~/.local/bin/autoq-widget --full

# ── Autoarranque opcional (inicia como widget compacto al entrar a Hyprland) ─
# Descomenta la línea de abajo si quieres tenerlo siempre visible al iniciar:
# exec-once = ~/.local/bin/autoq-widget --widget
