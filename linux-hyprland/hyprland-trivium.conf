# ============================================================================
# Trivium — Floating EQ Widget para Hyprland
# ============================================================================
# Copia este contenido dentro de tu ~/.config/hypr/hyprland.conf
# (o agrega:  source = ~/.local/share/trivium-hyprland/hyprland-trivium.conf)
# ============================================================================

# ── Reglas de ventana (Hyprland <= 0.52) ────────────────────────────────────
windowrulev2 = float, class:^(trivium-widget|trivium)$
windowrulev2 = pin, class:^(trivium-widget|trivium)$
windowrulev2 = noborder, class:^(trivium-widget|trivium)$
windowrulev2 = noshadow, class:^(trivium-widget|trivium)$
windowrulev2 = noblur, class:^(trivium-widget|trivium)$
windowrulev2 = move 100%-w-20 56, class:^(trivium-widget|trivium)$

# Nota: Si usas Hyprland >= 0.53 (nueva sintaxis windowrule), usa en su lugar:
# windowrule {
#     name = trivium-widget
#     match:class = ^(trivium-widget|trivium)$
#     float = on
#     pin = on
#     border_size = 0
#     no_shadow = on
#     no_blur = on
#     move = (monitor_w-window_w-20) 56
# }

# ── Atajos de teclado ───────────────────────────────────────────────────────
# SUPER + E : Mostrar / ocultar el widget flotante de Trivium (mantiene tu estado)
bind = SUPER, E, exec, ~/.local/bin/trivium-widget --toggle

# SUPER + SHIFT + E : Abrir directamente en modo App completa (3 pestañas)
bind = SUPER SHIFT, E, exec, ~/.local/bin/trivium-widget --full

# ── Autoarranque opcional (inicia como widget compacto al entrar a Hyprland) ─
# Descomenta la línea de abajo si quieres tenerlo siempre visible al iniciar:
# exec-once = ~/.local/bin/trivium-widget --widget
