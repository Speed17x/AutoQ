[workspace]
resolver = "2"
members = [
    "crates/autoq-core",
    "crates/autoq-cli",
    "crates/autoq-gui",
    "crates/autoq-daemon",
]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
autoq-core = { path = "crates/autoq-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
csv = "1.3"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
libc = "0.2"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
winreg = "0.52"
base64 = "0.22"
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
